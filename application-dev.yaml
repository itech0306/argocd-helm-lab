apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-gitops-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/itech0306/argocd-helm-lab
    targetRevision: main
    path: web-chart
    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true